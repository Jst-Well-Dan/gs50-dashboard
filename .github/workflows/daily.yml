name: daily

# 完整流水线（抓数 → 出页面 → 提交 docs/），Pages 源 = main /docs，push 即上线。
#
# === 调度已搬到自己的服务器（2026-11-09）===
# 本文件不再有 schedule，只剩 workflow_dispatch 当应急（服务器挂了 / 要补历史某天）。
# 现在的日常调度：服务器 117.72.111.211 上的 gs50-daily.timer
#   脚本 /opt/gs50-dashboard/deploy/run_daily.sh   （gate 逻辑见下，与本文件一致）
#   时间 Mon-Fri 17..21:00/20:00（北京，每 20 分钟心跳，Persistent）
#   日志 journalctl -u gs50-daily
#
# 为什么搬走：GitHub 的 schedule 在这个仓库长期不可靠——11-02 那两次 09:30/11:30 UTC 的 cron 直到
# 19:42/20:50 UTC 才跑（北京 03:42/04:50）；改成本文件里 17:00–21:40 每 20 分钟心跳后，实测每天仍
# 只落地 0–1 次（11-04/05/06 各 1 次，且都拖到 ~16:40–17:15 UTC = 北京次日 00:40–01:15），11-09 直接
# 一次都没跑 → 当天页面缺失。服务器 timer 是确定性的，且国内机房抓通达信/tushare/腾讯行情比 Azure 美西快。
#
# gate（本文件下面那步，手动触发时仍生效）：不能只问「今天」——延迟会跨过北京午夜，11-05/11-06 的页面
# 就是这么丢的。改成往前看 5 个日历日，挑「盘后包已发布(HTTP 200)、但页面还没出」的最晚一天。
on:
  workflow_dispatch:
    inputs:
      day:
        description: '数据日 YYYYMMDD（留空=自动取最近交易日）'
        required: false
      extra_args:
        description: '额外参数（如 --no-consensus 快速验证）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 心跳跑起来的一大半都是白跑：页面已出过、或盘后包还没发（非交易日）。
      # 在装依赖之前就判掉，一次跳过只花 ~15 秒。workflow_dispatch 一律真跑，方便手工重出。
      - name: 还有哪天要出页
        id: gate
        run: |
          today=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "今天（北京）= $today"
          day=""
          for k in 0 1 2 3 4; do
            d=$(TZ=Asia/Shanghai date -d "-$k day" +%Y%m%d)
            if [ -f "docs/data/$d.json" ]; then
              echo "$d：页面已存在"
              continue
            fi
            # 注意：不存在的日期返回 301 而不是 404，只有 200 才算「盘后包已发布」
            code=$(curl -s -o /dev/null -m 25 -w '%{http_code}' "http://www.tdx.com.cn/products/data/data/g4day/$d.zip" || echo ERR)
            echo "$d.zip → $code"
            if [ "$code" = "200" ]; then
              day=$d
              break
            fi
          done
          if [ -n "$day" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "day=$day" >> "$GITHUB_OUTPUT"
            echo "→ 要出 $day 的页面"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "最近 5 天都没有待出的页面 → 跳过"
          fi

      # 版本跟本机对齐：脚本里用了 f-string 内嵌反斜杠（3.12+ 才合法），pandas 也锁 3.0.x
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        with:
          python-version: '3.13'

      - name: 安装依赖
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          # six：tushare 1.4.29 的 trader 模块 import six，但它的依赖里没写 → 云端 pip 装不上，
          # import tushare 直接 ModuleNotFoundError，A 股共识这一步整条静默失败（PE_NTM 全空）
          pip install 'pandas==3.0.5' 'tushare==1.4.29' yfinance six

      # 数据源连通性探针：tdx 盘后包 / 腾讯行情 / tushare 代理。失败不中断，只为留证据。
      - name: 数据源连通性
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          for u in \
            "http://www.tdx.com.cn/products/data/data/g4day/$(TZ=Asia/Shanghai date +%Y%m%d).zip" \
            "https://qt.gtimg.cn/q=sh600519" \
            "https://tl.kaixin8.top/tushare/sdk" ; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$u" || echo "ERR")
            echo "$code  $u"
          done

      # data/ 与 .cache/ 不入库（体积大），靠 cache 在多次运行之间接力，避免每次重新回补历史
      - name: 恢复数据缓存
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/mkt
            data/quote
            data/kline
            data/consensus
            data/hk
            .cache
          key: gs50-data-${{ github.run_id }}
          restore-keys: gs50-data-

      - name: 抓数 + 出页面
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          TUSHARE_KEY: ${{ secrets.TUSHARE_KEY }}
          # 镜像端点是共享池，会整段 SSL EOF / 池子耗尽；dbquotes 徒官方端点兵底（见 theme_data.db_quotes）
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # 手工触发可指定数据日；定时触发用 gate 挑出来的「最晚一个缺页的已发布日」
          DAY: ${{ inputs.day || steps.gate.outputs.day }}
        run: |
          echo "数据日 = ${DAY:-（空，按今天算）}"
          python scripts/run_daily.py "$DAY" ${{ inputs.extra_args }} --require-today

      - name: 提交 docs/（Pages 从 main /docs 自动发布）
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "没有页面变化（非交易日或数据未更新），跳过提交"
          else
            git commit -m "dashboard: 云端更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') CST"
            git push
          fi
