name: daily

# 云端每天跑一遍完整流水线（抓数 → 出页面 → 提交 docs/），Pages 源 = main /docs，push 即上线。
# GitHub 的 cron 用 UTC：09:30 UTC = 17:30 北京时间。
on:
  schedule:
    - cron: '30 9 * * 1-5'    # 17:30 北京时间
    - cron: '30 11 * * 1-5'   # 19:30 北京时间：盘后包发得晚时的补跑（已出过就无 diff，不会重复提交）
  workflow_dispatch:
    inputs:
      day:
        description: '数据日 YYYYMMDD（留空=自动取最近交易日）'
        required: false
      extra_args:
        description: '额外参数（如 --no-consensus 快速验证）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 版本跟本机对齐：脚本里用了 f-string 内嵌反斜杠（3.12+ 才合法），pandas 也锁 3.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas==3.0.5' 'tushare==1.4.29' yfinance

      # 数据源连通性探针：tdx 盘后包 / 腾讯行情 / tushare 代理。失败不中断，只为留证据。
      - name: 数据源连通性
        continue-on-error: true
        run: |
          for u in \
            "http://www.tdx.com.cn/products/data/data/g4day/20261029.zip" \
            "https://qt.gtimg.cn/q=sh600519" \
            "https://tl.kaixin8.top/tushare/sdk" ; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$u" || echo "ERR")
            echo "$code  $u"
          done

      # data/ 与 .cache/ 不入库（体积大），靠 cache 在多次运行之间接力，避免每次重新回补历史
      - name: 恢复数据缓存
        uses: actions/cache@v4
        with:
          path: |
            data/mkt
            data/quote
            data/kline
            data/consensus
            data/hk
            .cache
          key: gs50-data-${{ github.run_id }}
          restore-keys: gs50-data-

      - name: 抓数 + 出页面
        env:
          TUSHARE_KEY: ${{ secrets.TUSHARE_KEY }}
        run: |
          python scripts/run_daily.py ${{ inputs.day }} ${{ inputs.extra_args }} --require-today

      - name: 提交 docs/（Pages 从 main /docs 自动发布）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "没有页面变化（非交易日或数据未更新），跳过提交"
          else
            git commit -m "dashboard: 云端更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') CST"
            git push
          fi
